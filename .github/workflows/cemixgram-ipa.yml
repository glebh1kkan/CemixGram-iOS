name: CemixGram IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: '0'

      - name: Fixup submodule URLs
        run: |
          # ../x.git relative URLs would resolve to our fork, where those
          # mirrors don't exist — point them back at the upstream org.
          git config submodule."submodules/rlottie/rlottie".url https://github.com/TelegramMessenger/rlottie.git
          git config submodule."submodules/TgVoipWebrtc/tgcalls".url https://github.com/TelegramMessenger/tgcalls.git
          # Multi-GB fetch over a shared runner network — retry instead of
          # failing the whole run on one bad connection.
          for i in 1 2 3; do
            git submodule update --init --recursive && break
            echo "submodule update attempt $i failed, retrying..."
            sleep 30
          done
          git submodule update --init --recursive --checkout

      - name: Set active Xcode path
        run: |
          XCODE_VERSION=$(cat versions.json | python3 -c 'import json,sys;obj=json.load(sys.stdin);print(obj["xcode"]);')
          if [ ! -d "/Applications/Xcode_$XCODE_VERSION.app" ]; then
            echo "Xcode $XCODE_VERSION not installed. Available:"
            ls -d /Applications/Xcode_*.app 2>/dev/null || echo "(none)"
            exit 1
          fi
          sudo xcode-select -s /Applications/Xcode_$XCODE_VERSION.app/Contents/Developer

      - name: Apply CemixGram server repoint
        run: |
          # Network.swift lives in the TelegramCore submodule, which is pinned
          # upstream — re-apply our patch on top of the checked-out submodule.
          # Skip when already applied (master carries the repoint in-tree).
          cd $GITHUB_WORKSPACE
          if grep -q "cemixgramSeedIps" submodules/TelegramCore/Sources/Network/Network.swift; then
            echo "repoint already present, skipping patch"
          else
            patch -p1 < cemixgram-server-repoint.patch
          fi
          grep -c "cemixgramSeedIps" submodules/TelegramCore/Sources/Network/Network.swift

      - name: Create canonical source directory
        run: |
          set -x
          sudo mkdir -p /Users/Shared
          cp -R $GITHUB_WORKSPACE /Users/Shared/
          mv /Users/Shared/$(basename $GITHUB_WORKSPACE) /Users/Shared/cemixgram-ios
          df -h / | tail -1

      - name: Validate codesigning inputs
        run: |
          # Fail in seconds (not after hours of build) when the bundle/team
          # has no matching profile with an aps-environment entitlement.
          cd /Users/Shared/cemixgram-ios
          python3 - <<'EOF'
          import json, os, plistlib, subprocess, sys
          cfg = json.load(open('build-system/cemixgram-configuration.json'))
          team, bundle = cfg.get('team_id', ''), ''
          import re
          bundle = cfg.get('bundle_id', '')
          assert team and bundle, 'team_id/bundle_id must be set in cemixgram-configuration.json'
          want = team + '.' + bundle
          profdir = 'build-system/fake-codesigning/profiles'
          for fn in sorted(os.listdir(profdir)):
              if not fn.endswith('.mobileprovision'):
                  continue
              out = subprocess.run(['openssl', 'smime', '-inform', 'der', '-verify',
                                    '-noverify', '-in', os.path.join(profdir, fn)],
                                   capture_output=True).stdout
              try:
                  ent = plistlib.loads(out)['Entitlements']
              except Exception:
                  continue
              if ent.get('application-identifier') == want:
                  if 'aps-environment' not in ent:
                      print(f'profile {fn} matches but lacks aps-environment')
                      sys.exit(1)
                  print(f'codesigning OK: {fn} -> {want} (aps={ent["aps-environment"]})')
                  sys.exit(0)
          print(f'no profile for {want} in {profdir}')
          sys.exit(1)
          EOF

      - name: Build the App (unsigned, sideload)
        run: |
          set -x
          SOURCE_DIR=/Users/Shared/cemixgram-ios
          BAZEL_USER_ROOT="/private/var/tmp/_bazel_containerhost"
          cd $SOURCE_DIR
          BUILD_NUMBER_OFFSET="$(cat build_number_offset)"
          export APP_VERSION=$(cat versions.json | python3 -c 'import json,sys;obj=json.load(sys.stdin);print(obj["app"]);')
          export COMMIT_COUNT=$(git rev-list --count HEAD)
          export COMMIT_COUNT="$(($COMMIT_COUNT+$BUILD_NUMBER_OFFSET))"
          export BUILD_NUMBER="$COMMIT_COUNT"
          echo "BUILD_NUMBER=$(echo $BUILD_NUMBER)" >> $GITHUB_ENV
          echo "APP_VERSION=$(echo $APP_VERSION)" >> $GITHUB_ENV
          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            build \
            --configurationPath="build-system/cemixgram-configuration.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER"

      - name: Collect IPA
        run: |
          set -x
          SOURCE_DIR=/Users/Shared/cemixgram-ios
          OUTPUT_PATH="$SOURCE_DIR/build/artifacts"
          rm -rf "$OUTPUT_PATH"
          mkdir -p "$OUTPUT_PATH"
          # Bazel config dir name varies (opt suffixes differ per toolchain),
          # so locate the IPA instead of globbing a fixed path.
          IPA_PATH="$(find "$SOURCE_DIR/bazel-out" -name 'Telegram.ipa' 2>/dev/null | head -1)"
          if [ -z "$IPA_PATH" ]; then
            echo "Telegram.ipa not found, build tree:"
            ls "$SOURCE_DIR/bazel-out/" 2>/dev/null || echo "(no bazel-out)"
            ls "$SOURCE_DIR/bazel-bin/" 2>/dev/null || echo "(no bazel-bin)"
            exit 1
          fi
          echo "found: $IPA_PATH"
          cp "$IPA_PATH" "$OUTPUT_PATH/CemixGram.ipa"
          ls -la "$OUTPUT_PATH"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: CemixGram-ipa
          path: /Users/Shared/cemixgram-ios/build/artifacts/CemixGram.ipa

# trigger workflow discovery
